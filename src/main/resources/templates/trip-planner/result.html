<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kết Quả Lịch Trình - DaLatTravel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-success fs-3" href="/">🌲 DaLatTravel</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link active" href="/trip-planner">Lên lịch trình</a></li>
                <li class="nav-item"><a class="nav-link" href="/carpool">Ghép xe đi chung</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h2 class="fw-bold text-success mb-4"><i class="fa-solid fa-map-location-dot"></i> Kế Hoạch Lịch Trình Gợi Ý Tối Ưu</h2>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-lightbulb text-warning"></i> Gợi Ý & Phân Tích Lộ Trình</h5>
            <ul class="list-group list-group-flush">
                <li class="list-group-item" th:each="s : ${model.suggestions}">
                    <i class="fa-solid fa-check text-success me-2"></i> <span th:text="${s}">Gợi ý</span>
                </li>
            </ul>
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/trip-planner" class="btn btn-outline-success btn-lg px-4"><i class="fa-solid fa-arrow-left"></i> Tạo Lịch Trình Khác</a>
        <a href="/carpool" class="btn btn-danger btn-lg px-4 ms-2"><i class="fa-solid fa-car-side"></i> Đăng Ký Ghép Xe Đến Các Điểm Trên</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
