<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lên Lịch Trình Du Lịch Đà Lạt - DaLatTravel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-success fs-3" href="/">🌲 DaLatTravel</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link active" href="/trip-planner">Lên lịch trình</a></li>
                <li class="nav-item"><a class="nav-link" href="/carpool">Ghép xe đi chung</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-success text-white p-4 rounded-top-4">
                    <h3 class="mb-0 fw-bold"><i class="fa-solid fa-route"></i> Thùng Công Cụ Lên Lịch Trình Tự Động</h3>
                    <p class="mb-0 text-white-50">Nhập ngân sách và yêu cầu của bạn để hệ thống tự động tối ưu lộ trình.</p>
                </div>
                <div class="card-body p-4">

                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <form th:action="@{/trip-planner}" method="post" th:object="${model}">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Ngân sách dự kiến (VNĐ):</label>
                            <input type="number" class="form-control form-control-lg" th:field="*{budget}" placeholder="Ví dụ: 3000000" required />
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Số ngày du lịch:</label>
                                <input type="number" class="form-control" th:field="*{numberOfDays}" min="1" max="30" value="3" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Chọn phương tiện di chuyển:</label>
                                <select class="form-select" th:field="*{selectedTransportId}">
                                    <option value="">-- Chọn phương tiện --</option>
                                    <option th:each="t : *{transportOptions}" th:value="${t.id}" th:text="${t.name}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Vĩ độ điểm bắt đầu (Latitude):</label>
                                <input type="number" step="any" class="form-control" th:field="*{startLatitude}" placeholder="10.8142" />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Kinh độ điểm bắt đầu (Longitude):</label>
                                <input type="number" step="any" class="form-control" th:field="*{startLongitude}" placeholder="106.7118" />
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Chọn các địa điểm muốn tham quan (Tùy chọn):</label>
                            <div class="row g-2" style="max-height: 200px; overflow-y: auto;">
                                <div class="col-md-6" th:each="place : *{touristPlaces}">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" th:value="${place.id}" th:field="*{selectedTouristPlaceIds}" />
                                        <label class="form-check-label" th:text="${place.name}"></label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Tạo Lịch Trình Tối Ưu
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
