<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Bài Viết Du Lịch Đà Lạt')}">
</head>
<body>

<!-- Navbar -->
<nav th:replace="~{fragments/header :: navbar('blog')}"></nav>

<!-- Header Section -->
<div class="bg-dark text-white py-4 mb-4 shadow-sm">
    <div class="container text-center">
        <h2 class="fw-bold mb-1"><i class="fa-solid fa-newspaper me-2"></i>Cẩm Nang & Kinh Nghiệm Du Lịch Đà Lạt</h2>
        <p class="mb-0 opacity-90">Chia sẻ bí quyết du lịch tự túc, kinh nghiệm săn mây và góc check-in sống ảo cực đẹp</p>
    </div>
</div>

<!-- Main Content -->
<div class="container mb-5">

    <div class="row g-4">
        <div class="col-md-6" th:each="post : ${posts}">
            <div class="card card-custom h-100 overflow-hidden">
                <img th:src="${post.imageUrl != null ? post.imageUrl : 'https://images.unsplash.com/photo-1511497584788-8767611136f6?auto=format&fit=crop&w=600&q=80'}"
                     class="card-custom-img" style="height: 220px;" alt="Bài viết du lịch">
                <div class="card-body p-4 d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-success-subtle text-success border px-3 py-1 rounded-pill small"><i class="fa-regular fa-user me-1"></i><span th:text="${post.author}">Admin</span></span>
                        <small class="text-muted"><i class="fa-regular fa-calendar me-1"></i>2026</small>
                    </div>
                    <h4 class="fw-bold text-dark mb-2" th:text="${post.title}">Tiêu đề bài viết</h4>
                    <p class="text-muted small mb-3 flex-grow-1" th:text="${post.content}">Nội dung bài viết</p>
                    <div class="pt-3 border-top mt-auto">
                        <a href="/blog" class="btn btn-outline-success rounded-pill px-4 fw-bold small">Đọc toàn bộ bài viết &rarr;</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Footer -->
<footer th:replace="~{fragments/header :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
