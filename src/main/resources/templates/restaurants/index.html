<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nhà Hàng & Quán Ăn Đà Lạt - DaLatTravel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-success fs-3" href="/">🌲 DaLatTravel</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="/trip-planner">Lên lịch trình</a></li>
                <li class="nav-item"><a class="nav-link" href="/carpool">Ghép xe đi chung</a></li>
                <li class="nav-item"><a class="nav-link active" href="/restaurants">Nhà hàng</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h2 class="fw-bold text-success mb-4"><i class="fa-solid fa-utensils"></i> Nhà Hàng & Quán Ăn Ngon Đà Lạt</h2>

    <div class="row g-4">
        <div class="col-md-4" th:each="r : ${restaurants}">
            <div class="card h-100 shadow-sm border-0 rounded-3">
                <div class="card-body">
                    <h5 class="card-title fw-bold text-warning text-dark" th:text="${r.name}">Tên</h5>
                    <p class="card-text text-muted mb-1"><i class="fa-solid fa-location-dot text-danger"></i> <span th:text="${r.address}">Địa chỉ</span></p>
                    <p class="card-text text-muted"><i class="fa-solid fa-phone text-success"></i> <span th:text="${r.phone}">SĐT</span></p>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="badge bg-warning text-dark fs-6" th:text="${#numbers.formatDecimal(r.averagePricePerPerson, 0, 'COMMA', 0, 'POINT')} + ' VNĐ / người'">Giá</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
