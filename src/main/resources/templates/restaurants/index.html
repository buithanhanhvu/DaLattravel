<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Nhà Hàng & Quán Ăn Đà Lạt')}">
</head>
<body>

<!-- Navbar -->
<nav th:replace="~{fragments/header :: navbar('restaurants')}"></nav>

<!-- Header Section -->
<div class="bg-warning text-dark py-4 mb-4 shadow-sm">
    <div class="container text-center">
        <h2 class="fw-bold mb-1"><i class="fa-solid fa-utensils me-2"></i>Nhà Hàng & Quán Ăn Ngon Đà Lạt</h2>
        <p class="mb-0 opacity-90">Khám phá thiên đường ẩm thực: Lẩu gà lá é, Lẩu bò Ba Toa, Bánh căn, Kem bơ gia truyền...</p>
    </div>
</div>

<!-- Main Content -->
<div class="container mb-5">

    <div class="row g-4">
        <div class="col-lg-4 col-md-6" th:each="r : ${restaurants}">
            <div class="card card-custom h-100">
                <img th:src="${r.imageUrl != null ? r.imageUrl : 'https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=600&q=80'}"
                     class="card-custom-img" alt="Nhà hàng Đà Lạt">
                <div class="card-body p-4 d-flex flex-column">
                    <h5 class="fw-bold text-dark mb-2" th:text="${r.name}">Tên quán</h5>
                    <p class="text-muted small mb-2"><i class="fa-solid fa-location-dot text-danger me-1"></i><span th:text="${r.address}">Địa chỉ</span></p>
                    <p class="text-muted small mb-3"><i class="fa-solid fa-phone text-success me-1"></i><span th:text="${r.phone}">SĐT</span></p>
                    <div class="pt-3 border-top d-flex justify-content-between align-items-center mt-auto">
                        <span class="fw-bold text-warning-emphasis fs-6" th:text="${#numbers.formatDecimal(r.averagePricePerPerson, 0, 'COMMA', 0, 'POINT')} + ' VNĐ / người'">Giá</span>
                        <a href="/restaurants" class="btn btn-sm btn-outline-warning text-dark rounded-pill px-3 fw-bold">Khám phá</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Footer -->
<footer th:replace="~{fragments/header :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
