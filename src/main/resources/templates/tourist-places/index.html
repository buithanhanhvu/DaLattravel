<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Địa Điểm Du Lịch Đà Lạt')}">
</head>
<body>

<!-- Navbar -->
<nav th:replace="~{fragments/header :: navbar('tourist-places')}"></nav>

<!-- Header Section -->
<div class="bg-success bg-gradient text-white py-4 mb-4 shadow-sm">
    <div class="container text-center">
        <h2 class="fw-bold mb-1"><i class="fa-solid fa-mountain-sun me-2"></i>Danh Sách Địa Điểm Du Lịch Nổi Bật Đà Lạt</h2>
        <p class="mb-0 opacity-90">Tổng hợp 50+ địa điểm tham quan, check-in, vui chơi và trải nghiệm không thể bỏ qua</p>
    </div>
</div>

<!-- Main Content -->
<div class="container mb-5">

    <div class="row g-4">
        <div class="col-lg-4 col-md-6" th:each="place : ${places}">
            <div class="card card-custom h-100">
                <img th:src="${place.imageUrl != null ? place.imageUrl : 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80'}"
                     class="card-custom-img" alt="Địa điểm Đà Lạt">
                <div class="card-body p-4 d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-success-subtle text-success border px-3 py-1 rounded-pill small"
                              th:text="${place.category != null ? place.category.name : 'Địa điểm'}">Danh mục</span>
                        <span class="text-warning fw-bold small"><i class="fa-solid fa-star me-1"></i><span th:text="${place.rating}">5</span>/5</span>
                    </div>
                    <h5 class="fw-bold text-dark mb-2" th:text="${place.name}">Tên địa điểm</h5>
                    <p class="text-muted small mb-3 flex-grow-1" th:text="${place.description}">Mô tả</p>
                    <div class="pt-3 border-top d-flex justify-content-between align-items-center mt-auto">
                        <span class="fw-bold text-danger small"
                              th:text="${place.ticketPrice != null and place.ticketPrice.compareTo(T(java.math.BigDecimal).ZERO) > 0} ? ${#numbers.formatDecimal(place.ticketPrice, 0, 'COMMA', 0, 'POINT')} + ' VNĐ' : 'Miễn phí'">Giá vé</span>
                        <a th:href="@{/trip-planner}" class="btn btn-sm btn-outline-success rounded-pill px-3 fw-bold">Thêm vào lịch trình</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Footer -->
<footer th:replace="~{fragments/header :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
