<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Địa Điểm Du Lịch Đà Lạt - DaLatTravel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-success fs-3" href="/">🌲 DaLatTravel</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="/trip-planner">Lên lịch trình</a></li>
                <li class="nav-item"><a class="nav-link" href="/carpool">Ghép xe đi chung</a></li>
                <li class="nav-item"><a class="nav-link active" href="/tourist-places">Địa điểm</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h2 class="fw-bold text-success mb-4"><i class="fa-solid fa-mountain-sun"></i> Danh Sách Địa Điểm Du Lịch Đà Lạt</h2>

    <div class="row g-4">
        <div class="col-md-4" th:each="place : ${places}">
            <div class="card h-100 shadow-sm border-0 rounded-3">
                <div class="card-body">
                    <h5 class="card-title fw-bold text-success" th:text="${place.name}">Tên</h5>
                    <p class="card-text text-muted" th:text="${place.description}">Mô tả</p>
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <span class="badge bg-warning text-dark"><i class="fa-solid fa-star"></i> <span th:text="${place.rating}">5</span> / 5</span>
                        <small class="text-secondary" th:text="'Mã: ' + ${place.id}">Mã</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
