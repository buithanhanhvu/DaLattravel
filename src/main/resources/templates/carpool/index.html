<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ghép Xe Đi Chung Đà Lạt - DaLatTravel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-success fs-3" href="/">🌲 DaLatTravel</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="/trip-planner">Lên lịch trình</a></li>
                <li class="nav-item"><a class="nav-link active" href="/carpool">Ghép xe đi chung</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row g-4">
        <div class="col-lg-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-danger text-white p-4 rounded-top-4">
                    <h3 class="mb-0 fw-bold"><i class="fa-solid fa-car-side"></i> Đăng Ký Ghép Xe Đi Chung</h3>
                    <p class="mb-0 text-white-50">Thuật toán Min-Cost Max-Flow & PDPTW kết nối chuyến xe tối ưu nhất.</p>
                </div>
                <div class="card-body p-4">

                    <div th:if="${model.statusMessage}" class="alert alert-info fw-bold" th:text="${model.statusMessage}"></div>

                    <form th:action="@{/carpool/request}" method="post" th:object="${model}">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Họ và tên khách hàng:</label>
                            <input type="text" class="form-control" th:field="*{passengerName}" placeholder="Nguyễn Văn A" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Số điện thoại:</label>
                            <input type="text" class="form-control" th:field="*{phoneNumber}" placeholder="0901234567" required />
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Địa chỉ đón:</label>
                                <input type="text" class="form-control" th:field="*{pickupAddress}" placeholder="Bến xe Miền Đông" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Địa chỉ đến:</label>
                                <input type="text" class="form-control" th:field="*{dropoffAddress}" placeholder="Chợ Đà Lạt" required />
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Số lượng khách:</label>
                                <input type="number" class="form-control" th:field="*{numberOfPassengers}" min="1" max="16" value="1" required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Loại xe mong muốn:</label>
                                <select class="form-select" th:field="*{requestedVehicleSeats}">
                                    <option value="4">Xe 4 chỗ</option>
                                    <option value="7">Xe 7 chỗ</option>
                                    <option value="9">Xe 9 chỗ (Limousine)</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold shadow-sm">
                            <i class="fa-solid fa-magnifying-glass-location"></i> Tìm & Ghép Xe Đi Chung
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-dark text-white p-4 rounded-top-4">
                    <h4 class="mb-0 fw-bold"><i class="fa-solid fa-list-ul"></i> Các Chuyến Xe Đang Khả Dụng</h4>
                </div>
                <div class="card-body p-4">
                    <div class="list-group list-group-flush">
                        <div class="list-group-item py-3" th:each="trip : ${model.openTrips}">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <h5 class="fw-bold mb-0 text-primary" th:text="${trip.driverName} + ' - ' + ${trip.vehicleType}">Tài xế</h5>
                                <span class="badge bg-success" th:text="'Trống ' + ${trip.availableSeats} + '/' + ${trip.totalSeats} + ' ghế'">Ghế</span>
                            </div>
                            <small class="text-muted d-block"><i class="fa-solid fa-circle-dot text-success"></i> Đón: <span th:text="${trip.pickupAddress}">Đón</span></small>
                            <small class="text-muted d-block"><i class="fa-solid fa-location-dot text-danger"></i> Đến: <span th:text="${trip.dropoffAddress}">Đến</span></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
