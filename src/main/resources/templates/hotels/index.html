<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Danh Sách Khách Sạn Đà Lạt')}">
</head>
<body>

<!-- Navbar -->
<nav th:replace="~{fragments/header :: navbar('hotels')}"></nav>

<!-- Header Section -->
<div class="bg-primary bg-gradient text-white py-4 mb-4 shadow-sm">
    <div class="container text-center">
        <h2 class="fw-bold mb-1"><i class="fa-solid fa-hotel me-2"></i>Danh Sách Khách Sạn & Resort Đà Lạt</h2>
        <p class="mb-0 opacity-90">Từ homestay ấm cúng, khách sạn trung tâm đến resort nghỉ dưỡng 5 sao cao cấp</p>
    </div>
</div>

<!-- Main Content -->
<div class="container mb-5">

    <div class="row g-4">
        <div class="col-lg-4 col-md-6" th:each="hotel : ${hotels}">
            <div class="card card-custom h-100">
                <img th:src="${hotel.imageUrl != null ? hotel.imageUrl : 'https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=600&q=80'}"
                     class="card-custom-img" alt="Khách sạn Đà Lạt">
                <div class="card-body p-4 d-flex flex-column">
                    <h5 class="fw-bold text-dark mb-2" th:text="${hotel.name}">Tên khách sạn</h5>
                    <p class="text-muted small mb-2"><i class="fa-solid fa-location-dot text-danger me-1"></i><span th:text="${hotel.address}">Địa chỉ</span></p>
                    <p class="text-muted small mb-3"><i class="fa-solid fa-phone text-success me-1"></i><span th:text="${hotel.phone}">SĐT</span></p>
                    <div class="pt-3 border-top d-flex justify-content-between align-items-center mt-auto">
                        <span class="fw-bold text-success fs-6" th:text="${#numbers.formatDecimal(hotel.pricePerNight, 0, 'COMMA', 0, 'POINT')} + ' VNĐ / đêm'">Giá</span>
                        <a href="/hotels" class="btn btn-sm btn-primary rounded-pill px-3 fw-bold">Đặt phòng</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Footer -->
<footer th:replace="~{fragments/header :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
