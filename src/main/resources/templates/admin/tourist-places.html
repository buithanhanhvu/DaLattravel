<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Quản Lý Địa Điểm Du Lịch - Admin')}">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav th:replace="~{fragments/header :: navbar('')}"></nav>

<div class="container py-4 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-dark mb-0"><i class="fa-solid fa-mountain text-success me-2"></i>Quản Lý Địa Điểm Du Lịch</h3>
        <button class="btn btn-success fw-bold rounded-pill shadow" data-bs-toggle="modal" data-bs-target="#addPlaceModal">
            <i class="fa-solid fa-plus me-1"></i> Thêm Địa Điểm Mới
        </button>
    </div>

    <!-- Alert success -->
    <div th:if="${successMessage}" class="alert alert-success fw-bold rounded-3 mb-4" th:text="${successMessage}"></div>

    <!-- Admin Tabs -->
    <ul class="nav nav-pills gap-2 mb-4 bg-white p-2 rounded-4 shadow-sm border">
        <li class="nav-item"><a class="nav-link fw-bold text-dark rounded-3" href="/admin"><i class="fa-solid fa-chart-pie me-1"></i> Tổng quan</a></li>
        <li class="nav-item"><a class="nav-link fw-bold text-dark rounded-3" href="/admin/hotels"><i class="fa-solid fa-hotel me-1"></i> Khách sạn</a></li>
        <li class="nav-item"><a class="nav-link active fw-bold rounded-3" href="/admin/tourist-places"><i class="fa-solid fa-mountain me-1"></i> Địa điểm du lịch</a></li>
        <li class="nav-item"><a class="nav-link fw-bold text-dark rounded-3" href="/admin/restaurants"><i class="fa-solid fa-utensils me-1"></i> Nhà hàng</a></li>
        <li class="nav-item"><a class="nav-link fw-bold text-dark rounded-3" href="/admin/bookings"><i class="fa-solid fa-calendar-check me-1"></i> Đặt phòng</a></li>
        <li class="nav-item"><a class="nav-link fw-bold text-dark rounded-3" href="/admin/users"><i class="fa-solid fa-users me-1"></i> Người dùng</a></li>
    </ul>

    <!-- Tourist Places Table -->
    <div class="card card-custom p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Mã ID</th>
                        <th>Hình ảnh</th>
                        <th>Tên địa điểm</th>
                        <th>Đánh giá</th>
                        <th>Giá vé</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${places}">
                        <td><span class="badge bg-secondary fw-bold" th:text="${p.id}">TP001</span></td>
                        <td>
                            <img th:src="${p.imageUrl}" class="rounded-3 shadow-sm" style="width: 60px; height: 45px; object-fit: cover;" alt="Place">
                        </td>
                        <td class="fw-bold text-success" th:text="${p.name}">Tên</td>
                        <td class="text-warning fw-bold"><i class="fa-solid fa-star me-1"></i><span th:text="${p.rating}">5</span></td>
                        <td class="fw-bold text-danger" th:text="${p.ticketPrice != null and p.ticketPrice.compareTo(T(java.math.BigDecimal).ZERO) > 0} ? ${#numbers.formatDecimal(p.ticketPrice, 0, 'COMMA', 0, 'POINT')} + ' VNĐ' : 'Miễn phí'">Giá vé</td>
                        <td>
                            <form th:action="@{'/admin/tourist-places/delete/' + ${p.id}}" method="post" style="display:inline;" onsubmit="return confirm('Bạn có chắc chắn muốn xóa địa điểm này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger rounded-circle"><i class="fa-solid fa-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Modal Add Place -->
<div class="modal fade" id="addPlaceModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow-lg">
            <div class="modal-header bg-success text-white rounded-top-4">
                <h5 class="modal-title fw-bold"><i class="fa-solid fa-plus me-2"></i>Thêm Địa Điểm Du Lịch Mới</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/admin/tourist-places/save}" method="post">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên địa điểm (*):</label>
                        <input type="text" name="name" class="form-control" placeholder="Đồi Chè Cầu Đất" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Mô tả ngắn (*):</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="Mô tả cảnh đẹp..." required></textarea>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Giá vé (VNĐ):</label>
                            <input type="number" name="ticketPrice" class="form-control" value="0">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Đánh giá (1-5 sao):</label>
                            <input type="number" name="rating" class="form-control" min="1" max="5" value="5">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Đường dẫn ảnh (URL Image):</label>
                        <input type="text" name="imageUrl" class="form-control" placeholder="https://images.unsplash.com/...">
                    </div>
                </div>
                <div class="modal-footer bg-light rounded-bottom-4">
                    <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-success rounded-pill fw-bold px-4">Lưu Địa Điểm</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Footer -->
<footer th:replace="~{fragments/header :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
