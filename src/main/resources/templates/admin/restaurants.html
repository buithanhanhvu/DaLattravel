<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Quản Lý Nhà Hàng - Admin')}">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav th:replace="~{fragments/header :: navbar('')}"></nav>

<div class="container py-4 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-dark mb-0"><i class="fa-solid fa-utensils text-warning me-2"></i>Quản Lý Nhà Hàng & Quán Ăn</h3>
        <button class="btn btn-warning text-dark fw-bold rounded-pill shadow" data-bs-toggle="modal" data-bs-target="#addRestaurantModal">
            <i class="fa-solid fa-plus me-1"></i> Thêm Quán Mới
        </button>
    </div>

    <!-- Alert success -->
    <div th:if="${successMessage}" class="alert alert-success fw-bold rounded-3 mb-4" th:text="${successMessage}"></div>

    <!-- Admin Tabs -->
    <ul class="nav nav-pills gap-2 mb-4 bg-white p-2 rounded-4 shadow-sm border">
        <li class="nav-item"><a class="nav-link fw-bold text-dark rounded-3" href="/admin"><i class="fa-solid fa-chart-pie me-1"></i> Tổng quan</a></li>
        <li class="nav-item"><a class="nav-link fw-bold text-dark rounded-3" href="/admin/hotels"><i class="fa-solid fa-hotel me-1"></i> Khách sạn</a></li>
        <li class="nav-item"><a class="nav-link fw-bold text-dark rounded-3" href="/admin/tourist-places"><i class="fa-solid fa-mountain me-1"></i> Địa điểm du lịch</a></li>
        <li class="nav-item"><a class="nav-link active fw-bold rounded-3" href="/admin/restaurants"><i class="fa-solid fa-utensils me-1"></i> Nhà hàng</a></li>
        <li class="nav-item"><a class="nav-link fw-bold text-dark rounded-3" href="/admin/bookings"><i class="fa-solid fa-calendar-check me-1"></i> Đặt phòng</a></li>
        <li class="nav-item"><a class="nav-link fw-bold text-dark rounded-3" href="/admin/users"><i class="fa-solid fa-users me-1"></i> Người dùng</a></li>
    </ul>

    <!-- Restaurants Table -->
    <div class="card card-custom p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>#ID</th>
                        <th>Hình ảnh</th>
                        <th>Tên nhà hàng</th>
                        <th>Địa chỉ</th>
                        <th>Số điện thoại</th>
                        <th>Giá bình quân / người</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${restaurants}">
                        <td class="fw-bold" th:text="${r.id}">1</td>
                        <td>
                            <img th:src="${r.imageUrl}" class="rounded-3 shadow-sm" style="width: 60px; height: 45px; object-fit: cover;" alt="Restaurant">
                        </td>
                        <td class="fw-bold text-dark" th:text="${r.name}">Tên</td>
                        <td class="small text-muted" th:text="${r.address}">Địa chỉ</td>
                        <td class="small" th:text="${r.phone}">SĐT</td>
                        <td class="fw-bold text-warning-emphasis" th:text="${#numbers.formatDecimal(r.averagePricePerPerson, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">Giá</td>
                        <td>
                            <form th:action="@{'/admin/restaurants/delete/' + ${r.id}}" method="post" style="display:inline;" onsubmit="return confirm('Bạn có chắc chắn muốn xóa nhà hàng này?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger rounded-circle"><i class="fa-solid fa-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Modal Add Restaurant -->
<div class="modal fade" id="addRestaurantModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow-lg">
            <div class="modal-header bg-warning text-dark rounded-top-4">
                <h5 class="modal-title fw-bold"><i class="fa-solid fa-plus me-2"></i>Thêm Quán Ăn / Nhà Hàng Mới</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/admin/restaurants/save}" method="post">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên quán ăn / nhà hàng (*):</label>
                        <input type="text" name="name" class="form-control" placeholder="Lẩu Gà Lá É" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Địa chỉ (*):</label>
                        <input type="text" name="address" class="form-control" placeholder="5 Đường 3 Tháng 4, Đà Lạt" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Số điện thoại (*):</label>
                        <input type="text" name="phone" class="form-control" placeholder="0901234567" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Giá bình quân 1 người (VNĐ) (*):</label>
                        <input type="number" name="averagePricePerPerson" class="form-control" placeholder="150000" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Đường dẫn ảnh (URL Image):</label>
                        <input type="text" name="imageUrl" class="form-control" placeholder="https://images.unsplash.com/...">
                    </div>
                </div>
                <div class="modal-footer bg-light rounded-bottom-4">
                    <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-warning text-dark rounded-pill fw-bold px-4">Lưu Nhà Hàng</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Footer -->
<footer th:replace="~{fragments/header :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
