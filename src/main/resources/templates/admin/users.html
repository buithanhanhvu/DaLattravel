<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Quản Lý Người Dùng - Admin')}">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav th:replace="~{fragments/header :: navbar('')}"></nav>

<div class="container py-4 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-dark mb-0"><i class="fa-solid fa-users text-primary me-2"></i>Quản Lý Người Dùng & Phân Quyền</h3>
    </div>

    <!-- Alert success -->
    <div th:if="${successMessage}" class="alert alert-success fw-bold rounded-3 mb-4" th:text="${successMessage}"></div>

    <!-- Admin Tabs -->
    <ul class="nav nav-pills gap-2 mb-4 bg-white p-2 rounded-4 shadow-sm border">
        <li class="nav-item"><a class="nav-link fw-bold text-dark rounded-3" href="/admin"><i class="fa-solid fa-chart-pie me-1"></i> Tổng quan</a></li>
        <li class="nav-item"><a class="nav-link fw-bold text-dark rounded-3" href="/admin/hotels"><i class="fa-solid fa-hotel me-1"></i> Khách sạn</a></li>
        <li class="nav-item"><a class="nav-link fw-bold text-dark rounded-3" href="/admin/tourist-places"><i class="fa-solid fa-mountain me-1"></i> Địa điểm du lịch</a></li>
        <li class="nav-item"><a class="nav-link fw-bold text-dark rounded-3" href="/admin/restaurants"><i class="fa-solid fa-utensils me-1"></i> Nhà hàng</a></li>
        <li class="nav-item"><a class="nav-link fw-bold text-dark rounded-3" href="/admin/bookings"><i class="fa-solid fa-calendar-check me-1"></i> Đặt phòng</a></li>
        <li class="nav-item"><a class="nav-link active fw-bold rounded-3" href="/admin/users"><i class="fa-solid fa-users me-1"></i> Người dùng</a></li>
    </ul>

    <!-- Users Table -->
    <div class="card card-custom p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Tên đăng nhập</th>
                        <th>Họ và tên</th>
                        <th>Email</th>
                        <th>Số điện thoại</th>
                        <th>Quyền hạn (Role)</th>
                        <th>Thay đổi quyền</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${users}">
                        <td class="fw-bold text-dark" th:text="${u.username}">username</td>
                        <td class="fw-bold text-primary" th:text="${u.fullName}">FullName</td>
                        <td class="small" th:text="${u.email}">email</td>
                        <td class="small" th:text="${u.phoneNumber}">SĐT</td>
                        <td>
                            <span class="badge px-3 py-2 rounded-pill"
                                  th:classappend="${u.role == 'ADMIN'} ? 'bg-danger' : 'bg-primary'"
                                  th:text="${u.role}">ROLE</span>
                        </td>
                        <td>
                            <form th:action="@{/admin/users/update-role}" method="post" class="d-flex gap-2">
                                <input type="hidden" name="userId" th:value="${u.id}">
                                <select name="role" class="form-select form-select-sm rounded-pill" style="width: 120px;">
                                    <option value="USER" th:selected="${u.role == 'USER'}">USER</option>
                                    <option value="ADMIN" th:selected="${u.role == 'ADMIN'}">ADMIN</option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-outline-primary rounded-pill fw-bold">Lưu</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Footer -->
<footer th:replace="~{fragments/header :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
