<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Liên Hệ Hỗ Trợ - DaLatTravel')}">
</head>
<body>

<!-- Navbar -->
<nav th:replace="~{fragments/header :: navbar('contact')}"></nav>

<!-- Header Section -->
<div class="bg-success bg-gradient text-white py-4 mb-4 shadow-sm">
    <div class="container text-center">
        <h2 class="fw-bold mb-1"><i class="fa-solid fa-envelope me-2"></i>Liên Hệ & Gửi Phản Hồi</h2>
        <p class="mb-0 opacity-90">Chúng tôi luôn sẵn sàng lắng nghe ý kiến và hỗ trợ du khách 24/7 tại Đà Lạt</p>
    </div>
</div>

<!-- Main Content -->
<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card card-custom p-4 p-md-5">
                <h3 class="fw-bold text-success mb-4"><i class="fa-solid fa-paper-plane me-2"></i>Gửi Tin Nhắn Cho DaLatTravel</h3>

                <div th:if="${successMessage}" class="alert alert-success fw-bold rounded-3 mb-4" th:text="${successMessage}"></div>

                <form th:action="@{/contact}" method="post" th:object="${contact}">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Họ và tên:</label>
                            <input type="text" class="form-control form-control-lg" th:field="*{name}" placeholder="Ví dụ: Nguyễn Văn A" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Số điện thoại:</label>
                            <input type="text" class="form-control form-control-lg" th:field="*{phoneNumber}" placeholder="0901234567" required />
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Email liên hệ:</label>
                        <input type="email" class="form-control form-control-lg" th:field="*{email}" placeholder="nguyenvana@gmail.com" required />
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Chủ đề:</label>
                        <input type="text" class="form-control form-control-lg" th:field="*{subject}" placeholder="Cần tư vấn lịch trình / Ghép xe / Đóng góp ý kiến" required />
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Nội dung chi tiết:</label>
                        <textarea class="form-control form-control-lg" th:field="*{message}" rows="4" placeholder="Nhập nội dung cần hỗ trợ..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 fw-bold rounded-pill py-3 shadow">
                        <i class="fa-solid fa-paper-plane me-2"></i> GỬI PHẢN HỒI NGAY
                    </button>
                </form>

            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer th:replace="~{fragments/header :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
