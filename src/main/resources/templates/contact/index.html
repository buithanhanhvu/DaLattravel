<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liên Hệ - DaLatTravel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-success fs-3" href="/">🌲 DaLatTravel</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="/trip-planner">Lên lịch trình</a></li>
                <li class="nav-item"><a class="nav-link" href="/carpool">Ghép xe đi chung</a></li>
                <li class="nav-item"><a class="nav-link active" href="/contact">Liên hệ</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-success text-white p-4 rounded-top-4">
                    <h3 class="mb-0 fw-bold"><i class="fa-solid fa-envelope"></i> Gửi Ý Kiến / Contact Us</h3>
                </div>
                <div class="card-body p-4">

                    <div th:if="${successMessage}" class="alert alert-success fw-bold" th:text="${successMessage}"></div>

                    <form th:action="@{/contact}" method="post" th:object="${contact}">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Họ và tên:</label>
                            <input type="text" class="form-control" th:field="*{name}" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email:</label>
                            <input type="email" class="form-control" th:field="*{email}" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Số điện thoại:</label>
                            <input type="text" class="form-control" th:field="*{phoneNumber}" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Chủ đề:</label>
                            <input type="text" class="form-control" th:field="*{subject}" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nội dung:</label>
                            <textarea class="form-control" th:field="*{message}" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">Gửi Phản Hồi</button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
