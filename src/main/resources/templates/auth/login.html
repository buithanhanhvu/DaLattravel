<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Đăng Nhập Hàng Đầu')}">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav th:replace="~{fragments/header :: navbar('')}"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-custom p-4 p-md-5 shadow-lg">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-success-subtle text-success p-3 mx-auto mb-3 d-inline-flex align-items-center justify-content-center" style="width: 70px; height: 70px;">
                        <i class="fa-solid fa-tree fs-1 text-success"></i>
                    </div>
                    <h3 class="fw-extrabold text-dark">Đăng Nhập DaLatTravel</h3>
                    <p class="text-muted small">Đăng nhập tài khoản để quản lý lịch trình & dịch vụ du lịch</p>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger fw-bold rounded-3 small" th:text="${errorMessage}"></div>
                <div th:if="${successMessage}" class="alert alert-success fw-bold rounded-3 small" th:text="${successMessage}"></div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên đăng nhập hoặc Email:</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-user text-secondary"></i></span>
                            <input type="text" name="username" class="form-control form-control-lg fs-6" placeholder="Ví dụ: admin hoặc user" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Mật khẩu:</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-secondary"></i></span>
                            <input type="password" name="password" class="form-control form-control-lg fs-6" placeholder="Nhập mật khẩu" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success btn-lg w-100 fw-bold rounded-pill shadow mb-3">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> ĐĂNG NHẬP
                    </button>
                </form>

                <div class="p-3 bg-light rounded-3 text-secondary small mb-3">
                    <p class="fw-bold text-dark mb-1"><i class="fa-solid fa-key text-warning me-1"></i> Tài khoản mẫu dùng thử:</p>
                    <p class="mb-1">• <strong>Admin</strong>: `admin` / `admin123` (Truy cập trang Quản trị)</p>
                    <p class="mb-0">• <strong>User</strong>: `user` / `user123` (Người dùng thông thường)</p>
                </div>

                <div class="text-center pt-3 border-top">
                    <p class="small text-muted mb-0">Chưa có tài khoản? <a href="/register" class="fw-bold text-success text-decoration-none">Đăng ký ngay &rarr;</a></p>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer th:replace="~{fragments/header :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
